version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: showmir
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-alexander}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Malinovy}
      POSTGRES_DB: ${DB_NAME:-showmir_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: showmir_app
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data: